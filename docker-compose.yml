version: '3.8'

services:
  comedytrail_app:
    image: comedytrail_app:0.1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ComedyTrail
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "5901:5901"
    volumes:
      - .:/var/www/comedytrail
      #- comedytrail_storage:/var/www/comedytrail/comedytrail-app/storage
      #- comedytrail_bootstrap_cache:/var/www/comedytrail/comedytrail-app/bootstrap/cache
    environment:
      - DB_HOST=ComedyTrail_Database
      - DB_USER=comedytrail_user
      - DB_PASSWORD=comedytrail_secret
      - DB_NAME=comedytrail
      - APP_ENV=production
      - APP_DEBUG=false
      - USER=root
      - DISPLAY=:1
      - VNC_PORT=5901
    privileged: true
    stdin_open: true
    tty: true
    networks:
      - comedy_trail_network

volumes:
  comedytrail_storage:
  comedytrail_bootstrap_cache:

networks:
  comedy_trail_network:
    driver: bridge
